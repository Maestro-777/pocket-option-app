name: Validate application

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'work/**'

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test
