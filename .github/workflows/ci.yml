name: Validate application

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'work/**'

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Option-Background-win-x64
          path: |
            dist/*Setup*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
